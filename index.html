<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decagon</title>

    <link rel="stylesheet" href="assets/StyleSheet/output.css">
    <link rel="stylesheet" href="assets/Font/FontSocials/style.css">
    <link rel="stylesheet" href="assets/Font/font/style.css">

</head>

<body class="overflow-x-hidden">

    <!--==================#1 HEADER ==================-->
    <!--==================================================-->
    <header class="fixed flex items-end justify-between lg:justify-between top-5 left-1/2 -translate-x-1/2 backdrop-blur-lg w-95/100 xl:w-4/5 2xl:w-70/100 px-5 z-9999 rounded-xl">

        <!--==================#1-1 LOGO ==================-->
        <div class="flex items-center gap-2">
            <figure><img src="assets/Images/Decagon_Logo-removebg-preview.png" alt=""></figure>
            <h4 class="capitalize font-semibold text-[20px] ">decagon</h4>
        </div>

        <!--==================#1-2 MENU ICON IN PHONE ==================-->
        <i onclick="openMenuMobile()" class="icon text-[20px] lg:hidden"></i>

        <!--==================#1-3 NAV  ==================-->
        <ul class="hidden lg:flex gap-6 h-full *:capitalize *:flex *:items-center *:gap-1.5 *:cursor-pointer">
            <li class="group h-full">product
                <i class="icon"></i>
                <div class="absolute top-full left-0 flex w-full invisible opacity-0 group-hover:opacity-100 group-hover:visible p-10">
                    <div class="bg-white w-71/100 rounded-tl-2xl rounded-bl-2xl flex flex-wrap px-4 py-5">
                        <h6>product overview <i class="icon"></i></h6>
                    </div>
                    <div class="bg-[#f4f4f5] w-29/100 rounded-tr-2xl rounded-br-2xl px-4 py-5"></div>
                </div>
            </li>

            <li>industries
                <i class="icon"></i>
            </li>

            <li>customers</li>
            <li>resources</li>
            <li>company</li>
        </ul>

        <!--==================#1-4 SIGN IN BTNS ==================-->
        <div class="hidden lg:flex items-center gap-2.5 *:border-2 *:text-[14px]  *:rounded-full *:py-1.5 *:px-3 *:flex *:items-center *:capitalize *:justify-center">
            <a href="" class="font-bold border-black">Sign in</a>
            <a href="" class="bg-black text-white border-red-500">get a demo</a>
        </div>

    </header>

    <main class="flex flex-wrap content-start">

        <section class="relative h-[300vh]">
            <div class="sticky top-0 h-screen overflow-hidden flex">
                <div id="sliderTrack" class="flex">
                    <img src="assets/Images/1.jpg" class="w-screen h-screen object-cover shrink-0" alt="">
                    <img src="assets/Images/2.jpg" class="w-screen h-screen object-cover shrink-0" alt="">
                    <img src="assets/Images/3.jpg" class="w-screen h-screen object-cover shrink-0" alt="">
                </div>
            </div>
        </section>

    </main>
















































</body>
<script src="assets/JavaScript/main.js"></script>

</html>
